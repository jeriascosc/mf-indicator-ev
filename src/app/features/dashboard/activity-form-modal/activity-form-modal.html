<form nz-form nzLayout="vertical" [formGroup]="form" class="activity-form">
  <nz-form-item>
    <nz-form-label nzRequired>Nombre</nz-form-label>
    <nz-form-control nzErrorTip="Ingrese un nombre de máximo 150 caracteres">
      <input
        nz-input
        formControlName="name"
        data-testid="field-name"
        placeholder="Nombre de la actividad"
      />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired>BAC (presupuesto total planificado)</nz-form-label>
    <nz-form-control nzErrorTip="El BAC no puede ser negativo">
      <nz-input-number
        formControlName="totalPlannedBudget"
        data-testid="field-bac"
        [nzMin]="0"
        [nzStep]="100"
      />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired>% Planeado (fracción 0.0 - 1.0)</nz-form-label>
    <nz-form-control nzErrorTip="Debe estar entre 0.0 y 1.0">
      <nz-input-number
        formControlName="porcentPlanned"
        data-testid="field-porcent-planned"
        [nzMin]="0"
        [nzMax]="1"
        [nzStep]="0.05"
      />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired>% Completado (fracción 0.0 - 1.0)</nz-form-label>
    <nz-form-control nzErrorTip="Debe estar entre 0.0 y 1.0">
      <nz-input-number
        formControlName="porcentComplete"
        data-testid="field-porcent-complete"
        [nzMin]="0"
        [nzMax]="1"
        [nzStep]="0.05"
      />
    </nz-form-control>
  </nz-form-item>

  <nz-form-item>
    <nz-form-label nzRequired>AC (costo real)</nz-form-label>
    <nz-form-control nzErrorTip="El costo real no puede ser negativo">
      <nz-input-number
        formControlName="actualCost"
        data-testid="field-actual-cost"
        [nzMin]="0"
        [nzStep]="100"
      />
    </nz-form-control>
  </nz-form-item>

  <div class="activity-form__footer">
    <button nz-button type="button" data-testid="modal-cancel" (click)="cancel()">Cancelar</button>
    <button nz-button nzType="primary" type="button" data-testid="modal-save" (click)="save()">
      Guardar
    </button>
  </div>
</form>
